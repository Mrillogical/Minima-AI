api:
  prefix: /api/v1

oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:9999/oauth2/callback}

app:
  base-url: ${APP_BASE_URL:http://localhost:8081/api/v1/auth/verify?token=}
  reset-pwd-url: ${APP_RESET_PWD_URL:http://localhost:8081/api/v1/auth/reset-password?token=}

spring:
  application:
    name: auth-service

  threads:
    virtual:
      enabled: true

  # Postgres â€” users, roles, refresh tokens
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:minima-AI_auth}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10           # max DB connections in pool
      minimum-idle: 2                 # keep 2 warm at all times
      connection-timeout: 30000
    connection-fetch: lazy

  # Liquibase â€” runs migrations on startup before app accepts traffic
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Liquibase owns schema â€” JPA only validates
    show-sql: false                   # never true in prod â€” use logs instead
    properties:
      hibernate:
        format_sql: true

  # Redis â€” refresh token store + blacklisted access tokens
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  # OAuth2 Google â€” client credentials from Google Cloud Console
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile

  # Mail config
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8081

# JWT config â€” secret shared with gateway (same env var)
jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-prod-must-be-256-bits}
  access-token-expiry-ms: 900000      # 15 minutes
  refresh-token-expiry-ms: 604800000  # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 0.1   # 1.0 in dev, set to 0.1 in prod env

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces

  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: info
    com.minima-AI: DEBUG
    org.springframework.web: DEBUG

eureka:
  client:
    service-url:
      # EUREKA_URL overridden to http://eureka-server:8761/eureka/ in Docker Compose
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10  # refresh instance list every 10s (default 30)
  instance:
    prefer-ip-address: true                  # register with IP not hostname - required in Docker
    lease-renewal-interval-in-seconds: 10    # heartbeat every 10s (default 30)
    lease-expiration-duration-in-seconds: 30 # Eureka marks dead after 30s no heartbeat

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

