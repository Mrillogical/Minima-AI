api:
  prefix: /api/v1

spring:
  application:
    name: url-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:minima-AI_urls}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20           # higher â€” URL redirect is high traffic
      minimum-idle: 5
      connection-timeout: 30000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
    connection-fetch: lazy

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  # Redis â€” cache-aside: check Redis before hitting Postgres on redirect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  # Kafka â€” publish url.created + url.deleted events
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false # wait for all replicas - no data loss
        max.block.ms: 3000  # fail fast in 3s instead of blocking 60s
        reconnect.backoff.ms: 1000      # wait 1s before reconnect attempt
        reconnect.backoff.max.ms: 10000 # max 10s between reconnect attempts
        retry.backoff.ms: 1000      # wait 1s between retries
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      retries: 3
    topics:
      url-created: ${URL_CREATED_EVENT:url.created}
      url-clicked: ${URL_CLICKED_EVENT:url.clicks}
      url-deleted: ${URL_DELETED_EVENT:url.deleted}
      url-classified: ${URL_CLASSIFIED_EVENT:url.classified}

server:
  port: 8082

# JWT - validate token forwarded by gateway
jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-prod-must-be-256-bits}

# RestClient â€” base URL for ai-service calls
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8084}

# URL config
url:
  base-domain: ${BASE_DOMAIN:http://localhost:8082}  # prepended to slug
  slug-length: 7                      # Base62 slug character count
  default-expiry-days: 30             # URLs expire after 30 days if no expiry set
  cache-ttl-seconds: 3600             # Redis TTL for cached URLs

eureka:
  client:
    service-url:
      # EUREKA_URL overridden to http://eureka-server:8761/eureka/ in Docker Compose
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10  # refresh instance list every 10s (default 30)
  instance:
    prefer-ip-address: true                  # register with IP not hostname â€” required in Docker
    lease-renewal-interval-in-seconds: 10    # heartbeat every 10s (default 30)
    lease-expiration-duration-in-seconds: 30 # Eureka marks dead after 30s no heartbeat

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 0.1        # 100% in dev, drop to 0.1 in prod

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces

  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: info
    com.minima-AI: DEBUG
    org.apache.kafka.common.config: OFF

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

