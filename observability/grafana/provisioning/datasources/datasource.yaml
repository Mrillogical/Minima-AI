apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-uid
    url: http://prometheus:9090
    access: proxy
    isDefault: true

  - name: Tempo
    type: tempo
    uid: tempo-uid
    url: http://tempo:3200
    access: proxy

  - name: Loki
    type: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      derivedFields:
        - datasourceUid: tempo-uid
          matcherRegex: '\[(\w+),\w+\]'
          name: TraceID
          url: '$${__value.raw}'

