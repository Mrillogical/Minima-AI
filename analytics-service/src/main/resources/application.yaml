api:
  prefix: /api/v1

spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:minima-AI_analytics}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
    connection-fetch: lazy

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

  # Kafka â€” consume events published by url-service
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topics:
      url-created: ${URL_CREATED_EVENT:url.created}
      url-clicked: ${URL_CLICKED_EVENT:url.clicks}
      url-deleted: ${URL_DELETED_EVENT:url.deleted}

eureka:
  client:
    service-url:
      # EUREKA_URL overridden to http://eureka-server:8761/eureka/ in Docker Compose
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10  # refresh instance list every 10s (default 30)
  instance:
    prefer-ip-address: true                  # register with IP not hostname â€” required in Docker
    lease-renewal-interval-in-seconds: 10    # heartbeat every 10s (default 30)
    lease-expiration-duration-in-seconds: 30 # Eureka marks dead after 30s no heartbeat

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 0.1   # 1.0 in dev, set to 0.1 in prod env

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces

  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: info
    com.minima-AI: DEBUG
    org.apache.kafka.common.config: OFF

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

