name: CI

on:
  push:
    branches:
    - '**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run unit tests (skip Spring context / integration tests)
        run: ./mvnw -B -fae test -Dtest='!*ApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 3

